[project]
name = "finsage-replica"
version = "0.1.0"
description = "Replication of FinSage (Wang et al., CIKM 2025) on FinanceBench open source."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
