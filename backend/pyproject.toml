[project]
name = "finsage-replica"
version = "0.1.0"
description = "Replication of FinSage (Wang et al., CIKM 2025) on FinanceBench open source."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.10.0",
    "faiss-cpu>=1.16.0",
    "fastapi>=0.162.5",
    "openai>=3.49.0",
    "pymupdf4llm>=2.1",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.2.0",
    "tiktoken>=0.14.0",
    "torch>=2.11.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

# RTX 5070 (Blackwell, sm_120) needs PyTorch wheels built for CUDA 12.8 or newer.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
